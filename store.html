<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b6cf6">
<title>店铺数据 · 电商工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand"><span class="logo">🛒</span>电商工作台 <small>双平台 · MULMUL</small></div>
  <nav class="areanav">
    <a class="an" href="index.html">📦 订单发货</a>
    <a class="an on" href="store.html">📊 店铺数据</a>
    <a class="an" href="finance.html">💰 财务</a>
  </nav>
  <div class="top-right">
    <span class="sync-pill" id="syncPill" title="数据每 15 分钟自动同步推送"></span>
    <button class="btn ghost" onclick="refreshNow()">⟳ 刷新</button>
  </div>
</div></header>

<div class="wrap">
  <div class="panel">
    <h2>📈 每日销售统计 <span class="tag">定型留存 · 自选 日 / 周 / 月 / 任意区间</span></h2>
    <div class="rg-head">
      <div class="plat-btns" id="salesPlatBtns">
        <button class="btn on" data-plat="all">双平台</button>
        <button class="btn" data-plat="Shopee">Shopee</button>
        <button class="btn" data-plat="TikTok">TikTok</button>
      </div>
      <div class="rg-presets" id="salesPresets">
        <button class="btn on" data-p="yesterday">昨日</button>
        <button class="btn" data-p="today">今天</button>
        <button class="btn" data-p="thisWeek">本周</button>
        <button class="btn" data-p="lastWeek">上周</button>
        <button class="btn" data-p="thisMonth">本月</button>
        <button class="btn" data-p="lastMonth">上月</button>
        <button class="btn" data-p="7d">近7天</button>
        <button class="btn" data-p="30d">近30天</button>
      </div>
      <div class="rg-custom">
        <input type="date" id="salesFrom"> ~ <input type="date" id="salesTo">
        <button class="btn primary" id="salesApply">查区间</button>
      </div>
    </div>
    <div id="salesStats"></div>
  </div>

  <div class="panel">
    <h2>📢 广告花费（双平台）<span class="tag">GMT+7 定型 · 留存半年 · 自选周期</span></h2>
    <div class="rg-presets" id="adsPresets" style="margin-bottom:12px">
      <button class="btn on" data-p="yesterday">昨日</button>
      <button class="btn" data-p="today">今天</button>
      <button class="btn" data-p="thisWeek">本周</button>
      <button class="btn" data-p="lastWeek">上周</button>
      <button class="btn" data-p="thisMonth">本月</button>
      <button class="btn" data-p="lastMonth">上月</button>
      <button class="btn" data-p="7d">近7天</button>
      <button class="btn" data-p="30d">近30天</button>
    </div>
    <div id="adsStats"></div>
  </div>

  <div class="panel">
    <h2>🏆 平台对照 <span class="tag">Shopee vs TikTok 累计销售与广告投入</span></h2>
    <div id="platCompare"></div>
  </div>

  <div class="footer">
    销售按本地自然日归档 · 广告按 GMT+7 自然日定型（留存半年）· 更新于 <span id="footTime">—</span>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
var salesSummary = null, salesPlat = 'all', salesFrom = null, salesTo = null, adSp = null, adTk = null;
var PLABEL = { yesterday:'昨日', today:'今天', thisWeek:'本周', lastWeek:'上周', thisMonth:'本月', lastMonth:'上月', '7d':'近7天', '30d':'近30天' };

function renderSales(rg, lbl) {
  var box = document.getElementById('salesStats');
  if (!salesSummary || !rg) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  var rows = (salesSummary.daily || []).filter(function (r) { return r.date >= rg.from && r.date <= rg.to; });
  if (salesPlat !== 'all') rows = rows.filter(function (r) { return r.platform === salesPlat; });
  if (!rows.length) { box.innerHTML = '<div class="empty"><span class="big">📭</span>该区间暂无销售数据</div>'; return; }
  var a = rows.reduce(function (s, r) { s.orders += r.orders; s.qty += r.totalQty; s.rp += r.amountLocal; s.cny += r.amountCny || 0; return s; }, { orders: 0, qty: 0, rp: 0, cny: 0 });
  var cards = '<div class="cards">' +
    '<div class="card"><div class="k">🧾 销售单数</div><div class="v">' + a.orders + '</div><div class="m">' + rows.length + ' 天记录</div></div>' +
    '<div class="card"><div class="k">👟 售出件数</div><div class="v">' + a.qty + '</div></div>' +
    '<div class="card"><div class="k">💰 销售金额</div><div class="v green">' + fmtRp(a.rp) + '</div></div>' +
    '<div class="card"><div class="k">🇨🇳 折合人民币</div><div class="v green">' + fmtCny(a.cny) + '</div><div class="m">汇率仅供参考</div></div>' +
    '</div>';
  var detail = rows.slice().reverse().map(function (r) {
    return '<div class="srow">' + r.date + ' · <b>' + r.platform + '</b> · ' + r.orders + ' 单 ' + r.totalQty + ' 件 · ' + fmtRp(r.amountLocal) + (r.amountCny ? ' <span class="aux">(' + fmtCny(r.amountCny) + ')</span>' : '') + '</div>';
  }).join('');
  box.innerHTML = cards + '<div class="upd" style="margin:10px 0 4px">' + lbl + '（' + (salesPlat === 'all' ? '双平台' : salesPlat) + ' · ' + rg.from + ' ~ ' + rg.to + '）</div>' + detail;
}
function doSales(p) {
  var rg = presetRange(p); if (!rg) return;
  salesFrom.value = rg.from; salesTo.value = rg.to;
  document.querySelectorAll('#salesPresets .btn').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-p') === p); });
  renderSales(rg, PLABEL[p] || p);
}
function bindSales() {
  document.querySelectorAll('#salesPresets .btn').forEach(function (b) { b.addEventListener('click', function () { doSales(b.getAttribute('data-p')); }); });
  salesFrom = document.getElementById('salesFrom'); salesTo = document.getElementById('salesTo');
  document.getElementById('salesApply').addEventListener('click', function () {
    if (salesFrom.value && salesTo.value) {
      document.querySelectorAll('#salesPresets .btn').forEach(function (x) { x.classList.remove('on'); });
      renderSales({ from: salesFrom.value, to: salesTo.value }, '自定义区间');
    }
  });
  document.getElementById('salesPlatBtns').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#salesPlatBtns .btn').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on'); salesPlat = b.getAttribute('data-plat');
    var cur = document.querySelector('#salesPresets .btn.on');
    doSales(cur ? cur.getAttribute('data-p') : 'yesterday');
  });
  var rg = presetRange('yesterday'); salesFrom.value = rg.from; salesTo.value = rg.to;
}

function adSum(rg) {
  function agg(src, f) {
    var rows = (src && src.daily || []).filter(function (r) { return r.date >= rg.from && r.date <= rg.to; });
    var a = { cost: 0, sales: 0, orders: 0, n: rows.length };
    rows.forEach(function (r) { a.cost += f.cost(r); a.sales += f.sales(r); a.orders += f.ord(r); });
    return a;
  }
  return {
    sp: adSp ? agg(adSp, { cost: function (r) { return r.expense || 0; }, sales: function (r) { return r.sales || 0; }, ord: function (r) { return r.orders || 0; } }) : null,
    tk: adTk ? agg(adTk, { cost: function (r) { return r.cost || 0; }, sales: function (r) { return r.grossRevenue || 0; }, ord: function (r) { return r.orders || 0; } }) : null
  };
}
function renderAds(rg) {
  var box = document.getElementById('adsStats');
  var r = adSum(rg);
  function card(title, a) {
    if (!a) return '<div class="card"><div class="k">' + title + '</div><div class="v dim">—</div></div>';
    var roas = a.cost > 0 ? Math.round((a.sales / a.cost) * 100) / 100 : null;
    return '<div class="card"><div class="k">' + title + '</div><div class="v red">' + fmtRp(a.cost) + '</div>' +
      '<div class="m">广告销售 ' + fmtRp(a.sales) + ' · ' + a.orders + ' 单</div>' +
      '<div class="v ' + (roas != null && roas >= 1 ? 'green' : 'red') + '" style="font-size:15px;margin-top:6px">ROAS/ROI ' + (roas != null ? roas : '—') + '</div></div>';
  }
  box.innerHTML = '<div class="cards">' + card('🟠 Shopee 广告', r.sp) + card('⚫ TikTok 广告', r.tk) + '</div>' +
    '<div class="upd">' + rg.label + '（' + rg.from + ' ~ ' + rg.to + ' · GMT+7 定型）</div>';
}
function doAds(p) { var rg = presetRange(p); if (rg) { document.querySelectorAll('#adsPresets .btn').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-p') === p); }); renderAds(rg); } }

function renderCompare() {
  var box = document.getElementById('platCompare');
  if (!salesSummary) { box.innerHTML = '<div class="empty">加载中…</div>'; return; }
  var rows = salesSummary.daily || [];
  function agg(plat) { var s = { orders: 0, rp: 0, days: 0 }; rows.forEach(function (r) { if (r.platform === plat) { s.orders += r.orders; s.rp += r.amountLocal; s.days++; } }); return s; }
  function ads(plat) {
    var src = plat === 'Shopee' ? adSp : adTk;
    if (!src || !src.periods || !src.periods.prevMonth) return { cost: 0, sales: 0 };
    var d = src.periods.prevMonth;
    return { cost: d.expense != null ? d.expense : (d.cost || 0), sales: d.sales != null ? d.sales : (d.grossRevenue || 0) };
  }
  var sp = agg('Shopee'), tk = agg('TikTok'), spAd = ads('Shopee'), tkAd = ads('TikTok');
  box.innerHTML = '<div class="cards">' +
    '<div class="card"><div class="k">🟠 Shopee 累计销售</div><div class="v green">' + fmtRp(sp.rp) + '</div><div class="m">' + sp.orders + ' 单 · ' + sp.days + ' 天<br>上月广告 ' + fmtRp(spAd.cost) + '</div></div>' +
    '<div class="card"><div class="k">⚫ TikTok 累计销售</div><div class="v green">' + fmtRp(tk.rp) + '</div><div class="m">' + tk.orders + ' 单 · ' + tk.days + ' 天<br>上月广告 ' + fmtRp(tkAd.cost) + '</div></div>' +
    '</div>';
}

fetch('sales_summary.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (a) {
  salesSummary = a; bindSales(); doSales('yesterday'); renderCompare();
  document.getElementById('footTime').textContent = relTime(a.updatedAt);
}).catch(function () { document.getElementById('salesStats').innerHTML = '<div class="empty">销售数据加载失败</div>'; });
fetch('ads_summary.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (a) { adSp = a; renderAds(presetRange('yesterday')); renderCompare(); }).catch(function () {});
fetch('ads_tk_summary.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (a) { adTk = a; renderAds(presetRange('yesterday')); }).catch(function () {});
bindAds();
function bindAds() {
  document.querySelectorAll('#adsPresets .btn').forEach(function (b) { b.addEventListener('click', function () { doAds(b.getAttribute('data-p')); }); });
}
initSyncPill();
setInterval(function () {
  fetch('sales_summary.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (a) { salesSummary = a; var cur = document.querySelector('#salesPresets .btn.on'); doSales(cur ? cur.getAttribute('data-p') : 'yesterday'); renderCompare(); }).catch(function () {});
  Promise.all([
    fetch('ads_summary.json?t=' + Date.now()).then(function (r) { return r.json(); }).catch(function () { return null; }),
    fetch('ads_tk_summary.json?t=' + Date.now()).then(function (r) { return r.json(); }).catch(function () { return null; })
  ]).then(function (arr) { adSp = arr[0]; adTk = arr[1]; renderAds(presetRange('yesterday')); });
}, 5 * 60 * 1000);
</script>
</body>
</html>
