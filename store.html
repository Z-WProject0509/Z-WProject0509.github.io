<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b6cf6">
<title>店铺数据 · 电商工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<style>
  .ctl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .grp { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 12px; }
  .grp > .gl { font-size: 12px; color: var(--text-3); font-weight: 650; }
  .grp button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 650; color: var(--text-2); cursor: pointer; font-family: inherit; }
  .grp button.on { background: var(--text); color: #fff; box-shadow: 0 1px 4px rgba(16,24,40,.2); }
  .grp.shop button { color: #fff; }
  .grp.shop button { background: var(--surface); }
  .grp.shop button.on { background: var(--text); color: #fff; }
  .datepick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; background: var(--surface); }
  .datepick input { border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--text); padding: 4px 2px; outline: none; width: 108px; }
  .datepick span { color: var(--text-3); font-size: 12px; }
  .shop-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .chartbox { position: relative; margin: 10px 0 2px; user-select: none; }
  .chartbox canvas { width: 100%; display: block; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .ch-hint { color: var(--text-3); font-size: 11.5px; margin: 4px 2px 0; line-height: 1.7; }
  .tot-bar { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  .tot-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; min-width: 110px; }
  .tot-card .tk { font-size: 11px; color: var(--text-3); }
  .tot-card .tv { font-size: 17px; font-weight: 750; color: var(--text); font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -.3px; }
  .tot-card .ts { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .lg i { width: 9px; height: 9px; border-radius: 3px; }
  .lg.off { opacity: .4; }
  .sum-strip { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 2px; }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand"><span class="logo">🛒</span>电商工作台 <small>店铺数据 · 多店对比</small></div>
  <nav class="areanav">
    <a class="an" href="index.html">📦 订单发货</a>
    <a class="an on" href="store.html">📊 店铺数据</a>
    <a class="an" href="finance.html">💰 财务</a>
  </nav>
  <div class="top-right">
    <span class="sync-pill" id="syncPill" title="数据每 15 分钟自动同步推送"></span>
    <button class="btn ghost" onclick="refreshNow()">⟳ 刷新</button>
  </div>
</div></header>

<div class="wrap">
  <div class="panel">
    <!-- 控制行：店铺多选 / 指标 / 粒度 / 日期区间 -->
    <div class="ctl-row">
      <div class="grp shop" id="shopGrp"><span class="gl">🏪 店铺</span></div>
      <div class="grp" id="metricGrp"><span class="gl">📊 指标</span>
        <button data-m="amount" class="on">💰 销售额</button>
        <button data-m="orders">🧾 单数</button>
        <button data-m="qty">👟 件数</button>
      </div>
      <div class="grp" id="granGrp"><span class="gl">⏱ 粒度</span>
        <button data-g="day" class="on">日</button>
        <button data-g="week">周</button>
        <button data-g="month">月</button>
      </div>
      <div class="grp" id="rangeGrp"><span class="gl">📅 区间</span>
        <button data-r="7d">近7天</button>
        <button data-r="30d">近30天</button>
        <button data-r="90d">近90天</button>
        <button data-r="all">全部</button>
      </div>
      <div class="datepick">
        <input type="date" id="fromD"><span>至</span><input type="date" id="toD">
      </div>
    </div>

    <!-- 汇总：随所选店铺+当前可见区间实时变 -->
    <div class="sum-strip" id="sumStrip"></div>

    <div class="chartbox" id="chartbox">
      <canvas id="chart" height="360"></canvas>
    </div>
    <div class="legend" id="legend"></div>
    <div class="ch-hint">🖱 <b>滚轮缩放</b>时间范围 · <b>按住左右拖动</b>平移 · <b>悬停</b>查看数值（默认不标数字）· 区间汇总随图表窗口实时变化</div>
    <div id="rangeTag" class="aux" style="margin-top:4px"></div>
  </div>

  <div class="footer">
    数据来源：站斧店铺环境自动同步 · 留存 ≥ 6 个月 · 折线图按 日/周/月 聚合，可滚轮缩放拖动浏览任意日期段 · 更新于 <span id="footTime">—</span>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
/* ================= 数据 ================= */
var RAW = [];          // sales_summary.daily 原行
var STORES = [];       // 店铺名数组(动态发现)
var onShops = {};      // store -> bool(选中)
var COLORS = ['#3b6cf6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16'];
var metric = 'amount'; // amount | orders | qty
var gran = 'day';      // day | week | month

var axis = [];         // [{label, start, end(含)}] 聚合点 (label=起始日期MM-DD, endDate为区间末)
var valByShop = {};    // shop -> 与 axis 等长数组 (无该店数据的点=null)
var canvas, ctx, box, W = 0, H = 0;
var padL = 64, padR = 14, padT = 16, padB = 28;
var view = null;       // {end: 轴索引, span: 点数}
var hoverIdx = -1, drag = null;

function fmtDate(ds) { return String(ds || '').slice(5); }          // MM-DD
function shortStore(s) { const m = String(s).match(/(Shopee|TikTok|Tokopedia|Lazada|虾皮)/i); return m ? m[1] : String(s).replace(/—.*$/, ''); }
function addDays(ds, n) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mondayOf(ds) { const d = new Date(ds + 'T00:00:00'); const w = (d.getDay() + 6) % 7; return addDays(ds, -w); }

/* ================= 加载 ================= */
function loadData() {
  fetch('sales_summary.json?t=' + Date.now()).then(r => r.json()).then(a => {
    RAW = a.daily || [];
    if (!RAW.length) { document.getElementById('sumStrip').innerHTML = '<div class="empty">暂无数据</div>'; return; }
    // 动态发现店铺(以后加店自动出现)
    const seen = [];
    RAW.forEach(r => { if (r.store && !seen.includes(r.store)) seen.push(r.store); });
    STORES = seen;
    onShops = {};
    STORES.forEach(s => onShops[s] = true);
    renderShopChips();
    const minD = RAW.reduce((m, r) => r.date < m ? r.date : m, '9999');
    const maxD = RAW.reduce((m, r) => r.date > m ? r.date : m, '');
    buildAxis(minD, maxD);
    document.getElementById('footTime').textContent = relTime(a.updatedAt);
    applyPreset('all');
  }).catch(() => { document.getElementById('sumStrip').innerHTML = '<div class="empty">数据加载失败</div>'; });
}

/* 聚合轴: 由最早~最晚日期按粒度生成点 */
function buildAxis(minD, maxD) {
  axis = [];
  if (gran === 'day') {
    let d = minD;
    while (d <= maxD) { axis.push({ start: d, end: d, label: fmtDate(d) }); d = addDays(d, 1); }
  } else if (gran === 'week') {
    let d = mondayOf(minD);
    while (d <= maxD) { const e = addDays(d, 6); axis.push({ start: d, end: e > maxD ? maxD : e, label: fmtDate(d) + '周' }); d = addDays(d, 7); }
  } else {
    // 月
    const first = new Date(minD + 'T00:00:00');
    let d = new Date(first.getFullYear(), first.getMonth(), 1);
    const last = new Date(maxD + 'T00:00:00');
    while (d <= last) {
      const ys = d.getFullYear(), ms = String(d.getMonth()+1).padStart(2,'0');
      const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
      const es = end.getFullYear() + '-' + String(end.getMonth()+1).padStart(2,'0') + '-' + String(end.getDate()).padStart(2,'0');
      axis.push({ start: ys + '-' + ms + '-01', end: es > maxD ? maxD : es, label: ys + '-' + ms });
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    }
  }
  // 每店铺: 逐日值表(按日缓存后再聚)
  const dayVal = {};   // store -> {date: {amount,orders,qty}}
  STORES.forEach(s => dayVal[s] = {});
  RAW.forEach(r => { if (dayVal[r.store] && r.date) dayVal[r.store][r.date] = { amount: r.amountLocal != null ? r.amountLocal : null, orders: r.orders != null ? r.orders : 0, qty: r.totalQty != null ? r.totalQty : 0 }; });
  valByShop = {};
  STORES.forEach(s => {
    const arr = axis.map(p => {
      let amt = 0, ord = 0, qty = 0, any = false;
      let d = p.start;
      while (d <= p.end) {
        const v = dayVal[s][d];
        if (v) { any = true; if (v.amount != null) amt += v.amount; ord += v.orders || 0; qty += v.qty || 0; }
        if (d === p.end) break;
        d = addDays(d, 1);
      }
      return any ? { amount: amt, orders: ord, qty: qty } : null;
    });
    valByShop[s] = arr;
  });
}

/* ================= 控制 ================= */
function renderShopChips() {
  const el = document.getElementById('shopGrp');
  el.innerHTML = '<span class="gl">🏪 店铺</span>' + STORES.map((s, i) =>
    '<button data-s="' + s + '" class="' + (onShops[s] ? 'on' : '') + '" style="' + (onShops[s] ? 'background:' + COLORS[i % COLORS.length] + ';border-color:transparent' : '') + '">' + shortStore(s) + '</button>'
  ).join('');
  if (!STORES.length) el.innerHTML = '<span class="gl">🏪 店铺</span><span class="aux">暂无</span>';
}
document.getElementById('shopGrp').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const s = b.getAttribute('data-s'); if (!s) return;
  onShops[s] = !onShops[s];
  // 全不选时自动至少保留一个
  if (!STORES.some(x => onShops[x])) { onShops[s] = true; }
  renderShopChips();
  drawAll();
});
document.getElementById('metricGrp').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#metricGrp button').forEach(x => x.classList.toggle('on', x === b));
  metric = b.getAttribute('data-m');
  drawAll();
});
document.getElementById('granGrp').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#granGrp button').forEach(x => x.classList.toggle('on', x === b));
  gran = b.getAttribute('data-g');
  // 重建轴, 保持末端
  const minD = axis.length ? axis[0].start : '';
  const maxD = axis.length ? axis[axis.length - 1].end : '';
  buildAxis(minD, maxD);
  view = { end: axis.length - 1, span: axis.length };
  syncDateInputs();
  drawAll();
});
document.getElementById('rangeGrp').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyPreset(b.getAttribute('data-r'));
});
function presetRange(p) {
  const t = new Date();
  const to = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  const todayIdx = axis.findIndex(x => x.end >= to);
  const N = axis.length;
  if (p === 'all') return { from: 0, to: N - 1 };
  if (p === '7d') return { from: Math.max(0, N - 7), to: N - 1 };
  if (p === '30d') return { from: Math.max(0, N - 30), to: N - 1 };
  if (p === '90d') return { from: Math.max(0, N - 90), to: N - 1 };
  return { from: 0, to: N - 1 };
}
function applyPreset(p) {
  if (!axis.length) return;
  const rg = presetRange(p);
  view = { end: rg.to, span: rg.to - rg.from + 1 };
  syncDateInputs();
  drawAll();
}
/* 把 view 显示为日历区间 */
function syncDateInputs() {
  if (!axis.length || !view) return;
  const vr = visibleRange();
  document.getElementById('fromD').value = axis[vr.start].start;
  document.getElementById('toD').value = axis[vr.end].end;
}
document.getElementById('fromD').addEventListener('change', applyDateInputs);
document.getElementById('toD').addEventListener('change', applyDateInputs);
function applyDateInputs() {
  const f = document.getElementById('fromD').value, t = document.getElementById('toD').value;
  if (!f || !t || !axis.length) return;
  const si = axis.findIndex(x => x.end >= f);
  const ei = axis.findIndex(x => x.end >= t);
  if (si < 0 || ei < 0 || si > ei) { syncDateInputs(); return; }
  view = { end: ei, span: ei - si + 1 };
  drawAll();
}

/* ================= 绘制 ================= */
function activeShops() { return STORES.filter(s => onShops[s]); }
function metricName() { return { amount: '销售额', orders: '单数', qty: '件数' }[metric]; }
function metricOf(v) {
  if (!v) return null;
  if (metric === 'orders') return v.orders;
  if (metric === 'qty') return v.qty;
  return v.amount != null ? v.amount : null;
}
function visibleRange() {
  if (!view) return { start: 0, end: 0 };
  return { start: Math.max(0, view.end - view.span + 1), end: view.end };
}
function fmtV(v) {
  if (metric === 'amount') return fmtRp(v);
  return Math.round(v || 0) + (metric === 'orders' ? ' 单' : ' 件');
}
function resize() {
  canvas = document.getElementById('chart');
  box = document.getElementById('chartbox');
  let w = box.clientWidth - 2; if (w < 220) w = 220;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(360 * dpr);
  canvas.style.height = '360px';
  ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  W = w; H = 360;
}
function draw() {
  if (!ctx || !axis.length) return;
  ctx.clearRect(0, 0, W, H);
  const vr = visibleRange();
  const n = vr.end - vr.start + 1;
  const shops = activeShops();
  if (!shops.length) { ctx.fillStyle = '#93a1b5'; ctx.font = '13px sans-serif'; ctx.fillText('请至少选择一个店铺', W/2 - 70, H/2); return; }
  const X = idx => padL + (idx - vr.start) / (n - 1 || 1) * (W - padL - padR);
  const allVals = [];
  shops.forEach(s => { for (let i = vr.start; i <= vr.end; i++) { const v = metricOf(valByShop[s][i]); if (v != null) allVals.push(v); } });
  if (!allVals.length) { ctx.fillStyle = '#93a1b5'; ctx.font = '13px sans-serif'; ctx.fillText('该区间暂无数据', W/2 - 50, H/2); return; }
  let vmax = Math.max.apply(null, allVals), vmin = 0;
  if (vmax === vmin) vmax = vmin + 1;
  const Y = v => padT + (1 - (v - vmin) / (vmax - vmin)) * (H - padT - padB);
  // 网格
  ctx.strokeStyle = '#eef1f6'; ctx.fillStyle = '#93a1b5'; ctx.font = '10.5px sans-serif'; ctx.lineWidth = 1;
  for (let t = 0; t <= 4; t++) {
    const gv = vmin + (vmax - vmin) * t / 4, gy = Y(gv);
    ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W - padR, gy); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(metric === 'amount' ? shortNum(gv) : Math.round(gv), padL - 6, gy + 3);
  }
  // X 刻度
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.ceil(n / 10));
  for (let i = vr.start; i <= vr.end; i += step) ctx.fillText(axis[i].label, X(i), H - 9);
  // 线 + 面积
  shops.forEach((s, si) => {
    const c = COLORS[STORES.indexOf(s) % COLORS.length];
    ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); let started = false;
    for (let i = vr.start; i <= vr.end; i++) {
      const v = metricOf(valByShop[s][i]);
      if (v == null) { started = false; continue; }
      const x = X(i), y = Y(v);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = .07; ctx.fillStyle = c;
    ctx.lineTo(X(vr.end), H - padB); ctx.lineTo(X(vr.start), H - padB); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  });
  // hover 十字线 + tooltip
  if (hoverIdx >= vr.start && hoverIdx <= vr.end) {
    const hx = X(hoverIdx);
    ctx.strokeStyle = '#c9d3e0'; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, H - padB); ctx.stroke(); ctx.setLineDash([]);
    const pt = axis[hoverIdx];
    const rngTxt = pt.end === pt.start ? pt.start : pt.start.slice(5) + ' ~ ' + pt.end.slice(5);
    let lines = [rngTxt];
    shops.forEach((s, si) => {
      const v = metricOf(valByShop[s][hoverIdx]);
      lines.push(shortStore(s) + ': ' + (v != null ? fmtV(v) : '—'));
    });
    ctx.font = '11px sans-serif';
    let tw = 0; lines.forEach(l => tw = Math.max(tw, ctx.measureText(l).width));
    const bx = Math.min(hx + 12, W - tw - 18), by = padT + 8;
    ctx.fillStyle = 'rgba(20,28,45,.93)';
    ctx.beginPath(); roundRect(bx, by, tw + 16, lines.length * 15 + 10, 6); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    lines.forEach((l, k) => ctx.fillText(l, bx + 8, by + 16 + k * 15));
  }
}
function roundRect(x, y, w, h, r) { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function shortNum(v) { return v >= 1000000 ? (v/1000000).toFixed(1) + 'M' : v >= 1000 ? (v/1000).toFixed(0) + 'k' : Math.round(v); }

/* ================= 汇总: 随当前可见窗口 ================= */
function renderSum() {
  const el = document.getElementById('sumStrip');
  if (!axis.length || !view) { el.innerHTML = ''; return; }
  const vr = visibleRange();
  const shops = activeShops();
  const sum = {};
  shops.forEach(s => {
    let amt = 0, ord = 0, qty = 0;
    for (let i = vr.start; i <= vr.end; i++) { const v = valByShop[s][i]; if (v) { amt += v.amount || 0; ord += v.orders || 0; qty += v.qty || 0; } }
    sum[s] = { amt, ord, qty };
  });
  let totAmt = 0, totOrd = 0, totQty = 0;
  shops.forEach(s => { totAmt += sum[s].amt; totOrd += sum[s].ord; totQty += sum[s].qty; });
  const f0 = axis[vr.start].start, f1 = axis[vr.end].end;
  const rangeTxt = '当前显示 ' + f0.slice(5) + ' ~ ' + f1.slice(5) + (gran === 'week' ? '（周聚合）' : gran === 'month' ? '（月聚合）' : '');
  document.getElementById('rangeTag').textContent = rangeTxt;
  el.innerHTML =
    '<div class="tot-card"><div class="tk">📦 销售额合计</div><div class="tv">' + fmtRp(totAmt) + '</div><div class="ts">' + shops.map(s => shortStore(s)).join(' + ') + '</div></div>' +
    '<div class="tot-card"><div class="tk">🧾 订单合计</div><div class="tv">' + totOrd + ' 单</div><div class="ts">' + shops.length + ' 家店铺</div></div>' +
    '<div class="tot-card"><div class="tk">👟 件数合计</div><div class="tv">' + totQty + ' 件</div></div>' +
    shops.map((s, si) => '<div class="tot-card"><div class="tk" style="color:' + COLORS[STORES.indexOf(s) % COLORS.length] + '">' + shortStore(s) + '</div><div class="tv">' + fmtRp(sum[s].amt) + '</div><div class="ts">' + sum[s].ord + ' 单 · ' + sum[s].qty + ' 件</div></div>').join('');
}

/* ================= 图例 ================= */
function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = activeShops().map((s, i) =>
    '<span class="lg" data-s="' + s + '"><i style="background:' + COLORS[STORES.indexOf(s) % COLORS.length] + '"></i>' + shortStore(s) + ' · ' + metricName() + '</span>'
  ).join('');
}
document.getElementById('legend').addEventListener('click', e => {
  const lg = e.target.closest('.lg'); if (!lg) return;
  const s = lg.getAttribute('data-s'); if (!s) return;
  onShops[s] = !onShops[s];
  if (!STORES.some(x => onShops[x])) onShops[s] = true;
  renderShopChips();
  drawAll();
});

function drawAll() { renderSum(); renderLegend(); draw(); }

/* ================= 交互 ================= */
function clampView() {
  if (!view) return;
  if (view.end < 0) view.end = 0;
  if (view.end > axis.length - 1) view.end = axis.length - 1;
  if (view.span < 2) view.span = 2;
  if (view.span > axis.length) view.span = Math.max(2, axis.length);
}
function xToIdx(px) {
  const vr = visibleRange(), n = vr.end - vr.start + 1;
  const f = (px - padL) / (W - padL - padR);
  return Math.round(vr.start + f * (n - 1));
}
function bindChart() {
  chartbox.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const anchor = xToIdx(e.clientX - rect.left);
    const old = view.span;
    const factor = e.deltaY > 0 ? 1.2 : 1 / 1.2;
    const ns = Math.max(2, Math.min(axis.length, Math.round(old * factor)));
    const pos = axis.length > 1 ? (anchor - view.end) / Math.max(1, view.span - 1) : 0;
    view.span = ns;
    view.end = Math.round(anchor - pos * (ns - 1));
    clampView();
    syncDateInputs();
    drawAll();
  }, { passive: false });
  canvas.addEventListener('mousedown', e => { drag = e.clientX; canvas.style.cursor = 'grabbing'; });
  window.addEventListener('mousemove', e => {
    if (drag != null) {
      const dx = e.clientX - drag; drag = e.clientX;
      const ppd = (W - padL - padR) / Math.max(1, view.span - 1);
      view.end -= Math.round(dx / ppd);
      clampView(); syncDateInputs(); drawAll();
    } else {
      const rect = canvas.getBoundingClientRect();
      const idx = xToIdx(e.clientX - rect.left);
      if (idx !== hoverIdx) { hoverIdx = idx; draw(); }
    }
  });
  window.addEventListener('mouseup', () => { if (drag != null) { drag = null; canvas.style.cursor = 'crosshair'; } });
  canvas.addEventListener('mouseleave', () => { if (hoverIdx !== -1) { hoverIdx = -1; draw(); } });
  canvas.style.cursor = 'crosshair';
}
window.addEventListener('resize', () => { resize(); draw(); });

initSyncPill();
bindChart();
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
