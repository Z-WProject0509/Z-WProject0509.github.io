<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b6cf6">
<title>店铺数据 · 电商工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="assets/style.css">
<style>
  .ctl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .grp { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 12px; }
  .grp > .gl { font-size: 12px; color: var(--text-3); font-weight: 650; }
  .grp button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 650; color: var(--text-2); cursor: pointer; font-family: inherit; }
  .grp button.on { background: var(--text); color: #fff; box-shadow: 0 1px 4px rgba(16,24,40,.2); }
  .grp.shop button { color: #fff; }
  .grp.shop button { background: var(--surface); }
  .grp.shop button.on { background: var(--text); color: #fff; }
  .datepick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; background: var(--surface); }
  .datepick input { border: 0; background: transparent; font: inherit; font-size: 12.5px; color: var(--text); padding: 4px 2px; outline: none; width: 108px; }
  .datepick span { color: var(--text-3); font-size: 12px; }
  .shop-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .chartbox { position: relative; margin: 10px 0 2px; user-select: none; }
  .chartbox canvas { width: 100%; display: block; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .chart-tip { position: absolute; z-index: 6; pointer-events: none; background: rgba(255,255,255,.97); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 6px 18px rgba(16,24,40,.14); padding: 7px 10px; font-size: 12px; line-height: 1.75; max-width: 300px; min-width: 130px; display: none; }
  .chart-tip .tip-d { font-weight: 750; color: var(--text); margin-bottom: 1px; letter-spacing: .2px; }
  .chart-tip .tip-row { display: flex; align-items: center; gap: 7px; color: var(--text-2); white-space: nowrap; }
  .chart-tip .tip-row i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chart-tip .tip-row b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 14px; }
  .chart-tip .tip-row small { color: var(--amber); }
  .chart-tip .tip-note { color: var(--text-3); font-size: 11px; border-top: 1px dashed var(--border); margin-top: 3px; padding-top: 3px; }
  .ch-hint { color: var(--text-3); font-size: 11.5px; margin: 4px 2px 0; line-height: 1.7; }
  .tot-bar { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  .tot-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; min-width: 110px; }
  .tot-card .tk { font-size: 11px; color: var(--text-3); }
  .tot-card .tv { font-size: 17px; font-weight: 750; color: var(--text); font-variant-numeric: tabular-nums; margin-top: 2px; letter-spacing: -.3px; }
  .tot-card .ts { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .lg i { width: 9px; height: 9px; border-radius: 3px; }
  .lg.off { opacity: .4; }
  .sum-strip { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 2px; }

  .topbar { margin: 0; }
  .trend-heading,.chart-heading { display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap; }
  .trend-heading { margin-bottom:24px; }
  .trend-heading h1 { font-size:24px;letter-spacing:-.5px; }
  .trend-heading p { color:var(--text-2);margin-top:4px;font-size:14px; }
  .ctl-row { gap:10px;margin-bottom:18px; }
  .grp { border-radius:12px;flex-wrap:wrap;max-width:100%;padding:5px 8px; }
  .grp > .gl { font-size:14px;padding:0 4px; }
  .grp button { font-size:14px;min-height:36px;padding:6px 12px; }
  .grp.shop { flex-basis:100%;border:0;background:none;padding-left:0; }
  .grp.shop button { color:var(--text-2);border:1px solid var(--border-strong); }
  .grp.shop button.on { background:var(--shop-color);color:#fff;border-color:var(--shop-color); }
  .grp:not(.shop) button.on { background:#eaf0ff;color:#214dcc;box-shadow:none; }
  .datepick { border-radius:10px;min-height:42px;flex-wrap:wrap;max-width:100%; }
  .datepick input { font-size:14px;width:128px; }
  .sum-strip { display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:0 0 28px; }
  .tot-card { min-width:0;padding:14px 16px;background:#f8faff; }
  .tot-card .tk { font-size:13px;color:var(--text-2);overflow-wrap:anywhere; }
  .tot-card .tv { font-size:22px;line-height:1.5;overflow-wrap:anywhere; }
  .tot-card .ts { font-size:12px;color:var(--text-2); }
  .shop-total { border-top:3px solid var(--shop-color);background:#fff; }
  .chart-heading { margin-bottom:12px; }
  .chart-heading h2 { margin:0;font-size:18px; }
  .chart-heading span { font-size:12px;color:var(--text-2); }
  .chart-actions { display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:14px; }
  .chart-actions label { display:flex;gap:7px;align-items:center;cursor:pointer; }
  .chart-actions input { width:16px;height:16px;accent-color:var(--primary); }
  .chartbox canvas { touch-action:pan-y;cursor:crosshair; }
  .point-detail { display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;min-height:60px;margin-top:14px;padding:14px 16px;border-radius:10px;background:#f4f7fc;font-size:14px; }
  .point-detail span { display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap; }
  .point-detail i { width:8px;height:8px;border-radius:50%; }
  .point-detail b { font-variant-numeric:tabular-nums; }
  .point-detail small { font-size:12px;color:#8a5700; }
  .lg { font-family:inherit;font-size:14px;padding:6px 12px; }
  .lg.off { opacity:1;color:#65748b;background:#f1f3f7;text-decoration:line-through; }
  .ch-hint { font-size:12px;color:var(--text-2);margin-top:10px; }
  .chart-status { font-size:13px;color:#725300;margin:10px 0 4px; }
  .chart-status.error { color:#b42318; }
  button:focus-visible,canvas:focus-visible,input:focus-visible { outline:3px solid #98b5ff;outline-offset:3px; }
  /* ===== 模块自选 / 店铺单选多选 / 明细表 ===== */
  .shop-mini { border:0;background:transparent;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:650;color:var(--text-3);cursor:pointer;font-family:inherit; }
  .shop-mini:hover { color:var(--primary); }
  .shop-mini.sep { border-left:1px solid var(--border-strong);border-radius:0;margin-left:2px;padding-left:10px; }
  .mod-note { font-size:11.5px;color:var(--text-3);margin:-8px 0 6px;line-height:1.6; }
  .tblzone { margin-top:14px;border-top:1px dashed var(--border);padding-top:10px; }
  .tbl-head { font-size:12.5px;color:var(--text-2);margin:0 0 6px; }
  .tbl-head b { color:var(--text); }
  .tbl-scroll { overflow:auto;max-height:320px;border:1px solid var(--border);border-radius:10px;background:#fff; }
  .tbl-scroll table { border-collapse:separate;border-spacing:0;min-width:520px;width:100%;font-size:12.5px; }
  .tbl-scroll th { position:sticky;top:0;z-index:2;background:#f6f8fc;color:var(--text-2);font-weight:700;padding:7px 9px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border-strong); }
  .tbl-scroll td { padding:5px 9px;border-bottom:1px solid #f0f3f8;white-space:nowrap;font-variant-numeric:tabular-nums; }
  .tbl-scroll td.na { color:var(--text-3); }
  .tbl-scroll td.cov { color:var(--amber); }
  .tbl-scroll tbody tr:hover td { background:#f7f9fd; }
  /* 日历区间弹层 */
  .hid-in { position:absolute; left:-9999px; opacity:0; pointer-events:none; }
  #calBtn { min-height:36px; font-weight:650; }
  .calpop { position:absolute; z-index:40; background:#fff; border:1px solid var(--border-strong); border-radius:14px; box-shadow:0 10px 30px rgba(16,24,40,.16); padding:12px; width:300px; margin-top:6px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .cal-title { font-weight:750; color:var(--text); font-size:14px; }
  .cal-nav { border:1px solid var(--border-strong); background:var(--surface); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; color:var(--text-2); font-family:inherit; }
  .cal-nav:hover { border-color:var(--primary); color:var(--primary); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-grid .cw { text-align:center; font-size:11px; color:var(--text-3); padding:2px 0; font-weight:700; }
  .cal-d { border:0; background:transparent; border-radius:8px; padding:5px 0; font-size:12.5px; cursor:pointer; color:var(--text); font-family:inherit; }
  .cal-d:hover { background:var(--primary-weak); color:var(--primary); }
  .cal-d.blank { pointer-events:none; }
  .cal-d.in { background:var(--primary-weak); color:var(--primary); border-radius:0; }
  .cal-d.sel { background:var(--primary); color:#fff; font-weight:750; box-shadow:0 2px 6px rgba(59,108,246,.35); border-radius:8px; }
  .cal-d.today { outline:1.5px solid var(--primary); outline-offset:-1px; }
  .cal-qt { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .cal-qt .btn { padding:4px 10px; font-size:12px; }
  .cal-tip { font-size:11px; color:var(--text-3); margin-top:8px; line-height:1.6; }
  /* 店铺工具缩小(次要控件) */
  .shop-mini { font-size:11px; padding:1px 6px; color:var(--text-3); }
  .shop-mini.on { color:var(--primary); }
  .shop-mini.sep { margin-left:0; padding-left:6px; }
  button:focus-visible,canvas:focus-visible,input:focus-visible { outline:3px solid #98b5ff;outline-offset:3px; }
  @media(max-width:600px) {
    .wrap { padding:14px 10px 30px; }.panel { padding:14px 12px; }
    .sum-strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tot-card .tv { font-size:19px; }.trend-heading h1 { font-size:22px; }
    .topbar { padding:10px; }.brand small { display:none; }.areanav { max-width:100%;flex-wrap:wrap;border-radius:12px; }
    .areanav a.an { padding:6px 10px; }.top-right { margin-left:0; }
    .chart-actions { gap:10px; }.point-detail { align-items:flex-start;flex-direction:column;gap:8px; }
  }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand"><span class="logo">🛒</span>电商工作台 <small>店铺数据 · 多店对比</small></div>
  <nav class="areanav">
    <a class="an" href="index.html">📦 订单发货</a>
    <a class="an on" href="store.html">📊 店铺数据</a>
    <a class="an" href="finance.html">💰 财务</a>
  </nav>
  <div class="top-right">
    <span class="sync-pill" id="syncPill" title="数据每 15 分钟自动同步推送"></span>
    <button class="btn ghost" onclick="refreshNow()">⟳ 刷新</button>
  </div>
</div></header>

<div class="wrap">
  <div class="panel">
    <div class="trend-heading"><div><h1>店铺趋势</h1><p>查看销售变化，对比各店铺表现</p></div><button class="btn" id="retryData">刷新数据</button></div>
    <!-- 控制行：店铺多选 / 指标(可多选) / 粒度 / 日历日期区间 -->
    <div class="ctl-row">
      <div class="grp shop" id="shopGrp"><span class="gl">🏪 店铺</span></div>
    </div>
    <div class="ctl-row">
      <div class="grp" id="metricGrp"><span class="gl">📊 指标 <span class="aux">可多选 · 多选=相对走势</span></span>
        <button data-m="amount" class="on">💰 销售额</button>
        <button data-m="orders" class="on">🧾 订单数</button>
        <button data-m="qty" class="on">👟 销售件数</button>
      </div>
      <div class="grp" id="granGrp"><span class="gl">⏱ 粒度</span>
        <button data-g="day" class="on">日</button>
        <button data-g="week">周</button>
        <button data-g="month">月</button>
      </div>
      <button class="btn ghost" id="calBtn" type="button" title="点开日历选任意日期区间">📅 <span id="calLbl">—</span> ▾</button>
      <input type="date" id="fromD" class="hid-in" aria-label="开始日期">
      <input type="date" id="toD" class="hid-in" aria-label="结束日期">
    </div>
    <!-- 日历区间弹层 -->
    <div class="calpop" id="calPop" hidden>
      <div class="cal-head">
        <button class="cal-nav" id="calPrevM" type="button">‹ 上月</button>
        <span class="cal-title" id="calTitle">—</span>
        <button class="cal-nav" id="calNextM" type="button">下月 ›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-qt">
        <button class="btn" data-q="today" type="button">今天</button>
        <button class="btn" data-q="yest" type="button">昨天</button>
        <button class="btn" data-q="month" type="button">本月</button>
        <button class="btn" data-q="lmonth" type="button">上月</button>
        <button class="btn ghost" id="calClose" type="button">收起</button>
      </div>
      <div class="cal-tip" id="calTip">先点开始日期，再点结束日期＝整段区间；同一日期点两下＝只看那天</div>
    </div>

    <!-- 模块自选：要哪块点哪块，可多选，即点即显 -->
    <div class="ctl-row">
      <div class="grp" id="modGrp"><span class="gl">🧩 看什么模块（可多选）</span>
        <button data-mod="sum" class="on">🧮 汇总卡</button>
        <button data-mod="chart" class="on">📈 趋势图</button>
        <button data-mod="table" class="on">📋 每日一览</button>
      </div>
    </div>

    <!-- 汇总：随所选店铺+当前可见区间实时变 -->
    <div class="sum-strip" id="sumStrip"></div>

    <div class="chart-heading" id="chartHead"><div><h2 id="chartTitle">销售额趋势</h2><span id="chartUnit">单位：IDR</span></div><div class="chart-actions"><label><input type="checkbox" id="showValues"> 显示数值</label><button class="btn ghost" id="resetView">恢复所选范围</button></div></div>
    <div class="chartbox" id="chartbox">
      <canvas id="chart" height="360" tabindex="0" role="img" aria-label="店铺趋势折线图" aria-describedby="pointDetail chartHint">店铺销售趋势。图表下方提供所选日期的数值。</canvas>
    </div>
    <div class="legend" id="legend"></div>
    <div id="pointDetail" class="point-detail" aria-live="polite">正在读取店铺数据…</div>
    <div class="ch-hint" id="chartHint">悬停或轻点折线查看数值 · 滚轮缩放，鼠标拖动平移 · 键盘左右键逐点查看 · 空心点表示该周期数据未采集完整</div>
    <div id="labelHint" class="ch-hint"></div>
    <div id="chartStatus" class="chart-status" role="status">正在加载…</div>
    <div id="rangeTag" class="aux" style="margin-top:4px"></div>

    <!-- 每日一览：逐日逐店数值（含环比增降） -->
    <div class="tblzone" id="tableZone" style="display:none">
      <div class="tbl-head" id="tableHead"></div>
      <div class="tbl-scroll" id="tableBody"></div>
    </div>
  </div>

  <div class="footer">
    数据来源：店铺日报 · 日期按日报记录，缺失数据不补零 · 更新于 <span id="footTime">—</span>
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/store-data.js"></script>
<script src="assets/store.js"></script>
<script>
// ===== 日历日期区间(替换原近7/30/90预设): 任意区间 / 单日 / 本月 / 上月 =====
(function () {
  var btn = document.getElementById('calBtn'), pop = document.getElementById('calPop');
  if (!btn || !pop) return;
  var grid = document.getElementById('calGrid'), title = document.getElementById('calTitle');
  var fromD = document.getElementById('fromD'), toD = document.getElementById('toD'), lbl = document.getElementById('calLbl');
  var tipEl = document.getElementById('calTip');
  var WK = ['日', '一', '二', '三', '四', '五', '六'];
  var vY = 0, vM = 0, pick = null; // pick: 已点开始日 {y,m,d}
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var dstr = function (y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); };
  function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function monthRange(y, m) { return { from: dstr(y, m, 1), to: dstr(y, m, daysIn(y, m)) }; }
  function fmtLabel(s) { return s ? s.slice(5).replace('-', '/') : ''; }
  function curRange() { return { from: fromD.value || '', to: toD.value || '' }; }
  function refreshLbl() {
    var r = curRange();
    lbl.textContent = (r.from ? fmtLabel(r.from) : '?') + ' ~ ' + (r.to ? fmtLabel(r.to) : '?');
  }
  function apply(from, to) {
    if (!from || !to) return;
    if (to < from) { var t = from; from = to; to = t; }
    fromD.value = from; toD.value = to;
    fromD.dispatchEvent(new Event('change')); // store.js useDates 处理 → 重绘
    refreshLbl();
  }
  function render() {
    title.textContent = vY + ' 年 ' + (vM + 1) + ' 月';
    var first = new Date(vY, vM, 1), days = new Date(vY, vM + 1, 0).getDate();
    var startDow = first.getDay(); // 0=周日
    var h = '';
    for (var w = 0; w < 7; w++) h += '<span class="cw">' + WK[w] + '</span>';
    var r = curRange();
    for (var i = 0; i < startDow; i++) h += '<span class="cal-d blank"></span>';
    for (var d = 1; d <= days; d++) {
      var ds = dstr(vY, vM, d);
      var cls = 'cal-d';
      var inSel = false, isSel = false;
      if (r.from && r.to && r.from <= ds && ds <= r.to) {
        inSel = true;
        if (ds === r.from || ds === r.to) isSel = true;
      } else if (pick && pick.y === vY && pick.m === vM && pick.d === d) isSel = true;
      var t = new Date();
      var isToday = t.getFullYear() === vY && t.getMonth() === vM && t.getDate() === d;
      cls += inSel && !isSel ? ' in' : '';
      cls += isSel ? ' sel' : '';
      cls += isToday ? ' today' : '';
      h += '<button type="button" class="' + cls + '" data-ymd="' + ds + '">' + d + '</button>';
    }
    grid.innerHTML = h;
  }
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.cal-d[data-ymd]'); if (!b) return;
    var ds = b.dataset.ymd;
    var cur = curRange();
    if (!pick && !cur.from) { pick = { y: +ds.slice(0, 4), m: +ds.slice(5, 7) - 1, d: +ds.slice(8, 10) }; tipEl.textContent = '已选开始 ' + ds + '，再点一天＝区间；再点同一天＝只看这天'; }
    else if (pick) {
      var p = dstr(pick.y, pick.m, pick.d);
      if (p === ds) { apply(ds, ds); }           // 同一天两下 → 单日
      else { apply(p, ds); }
      pick = null; tipEl.textContent = '先点开始日期，再点结束日期＝整段区间；同一日期点两下＝只看那天';
    } else { // 已有区间, 再点=新起点(重新选)
      pick = { y: +ds.slice(0, 4), m: +ds.slice(5, 7) - 1, d: +ds.slice(8, 10) };
      tipEl.textContent = '已选开始 ' + ds + '，再点一天＝区间；再点同一天＝只看这天';
    }
    render();
  });
  function navMonth(dm) { vM += dm; if (vM < 0) { vM = 11; vY--; } if (vM > 11) { vM = 0; vY++; } render(); }
  document.getElementById('calPrevM').addEventListener('click', function () { navMonth(-1); });
  document.getElementById('calNextM').addEventListener('click', function () { navMonth(1); });
  document.querySelectorAll('.cal-qt [data-q]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = new Date();
      if (b.dataset.q === 'today') { apply(dstr(t.getFullYear(), t.getMonth(), t.getDate()), dstr(t.getFullYear(), t.getMonth(), t.getDate())); }
      else if (b.dataset.q === 'yest') { var y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1); apply(dstr(y.getFullYear(), y.getMonth(), y.getDate()), dstr(y.getFullYear(), y.getMonth(), y.getDate())); }
      else if (b.dataset.q === 'month') { var mr = monthRange(t.getFullYear(), t.getMonth()); apply(mr.from, mr.to); }
      else if (b.dataset.q === 'lmonth') { var lm = new Date(t.getFullYear(), t.getMonth() - 1, 1); var lr = monthRange(lm.getFullYear(), lm.getMonth()); apply(lr.from, lr.to); }
      hide();
    });
  });
  document.getElementById('calClose').addEventListener('click', hide);
  function hide() { pop.hidden = true; pick = null; }
  function show() {
    var t = new Date();
    var r = curRange();
    var anchor = r.from ? new Date(r.from) : t;
    if (!vY) { vY = anchor.getFullYear(); vM = anchor.getMonth(); }
    pick = null;
    render();
    pop.hidden = false;
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); pop.hidden ? show() : hide(); });
  document.addEventListener('click', function (e) { if (!pop.hidden && !pop.contains(e.target) && e.target !== btn && !btn.contains(e.target)) hide(); });
  refreshLbl();
})();
</script>
</body>
</html>
