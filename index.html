<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商工作台 · 双平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f4f8; color: #1f2d3d; padding: 20px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 18px; }
  h1.top { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #7a8ba3; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0 4px; }
  .tab { padding: 8px 18px; border-radius: 8px 8px 0 0; background: #dde5ee; color: #4b5d71; font-size: 14px; font-weight: 600; cursor: pointer; border: none; user-select: none; }
  .tab.on { background: #fff; color: #0e2a47; box-shadow: 0 -1px 4px rgba(0,0,0,.05); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .k { font-size: 13px; color: #7a8ba3; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; color: #0e2a47; }
  .card .v.red { color: #dc2626; }
  .card .v.green { color: #16a34a; }
  .panel { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .panel h2 { font-size: 16px; margin-bottom: 10px; color: #0e2a47; }
  .panel h2 .tag { font-size: 12px; color: #7a8ba3; font-weight: 400; }
  .fhead { overflow: hidden; background: #fafbfd; border-bottom: 2px solid #e2e8f0; }
  .fbody { max-height: min(58vh, 560px); overflow: auto; }
  .fhead table, .fbody table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  .fhead th, .fbody td { padding: 7px 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .fbody td { border-bottom: 1px solid #eef2f7; }
  .st-red { color: #dc2626; font-weight: 700; }
  .w8 .fhead th:nth-child(1), .w8 .fbody td:nth-child(1) { width: 5%; }
  .w8 .fhead th:nth-child(2), .w8 .fbody td:nth-child(2) { width: 15%; }
  .w8 .fhead th:nth-child(3), .w8 .fbody td:nth-child(3) { width: 15%; }
  .w8 .fhead th:nth-child(4), .w8 .fbody td:nth-child(4) { width: 17%; }
  .w8 .fhead th:nth-child(5), .w8 .fbody td:nth-child(5) { width: 6%; }
  .w8 .fhead th:nth-child(6), .w8 .fbody td:nth-child(6) { width: 13%; }
  .w8 .fhead th:nth-child(7), .w8 .fbody td:nth-child(7) { width: 13%; }
  .w8 .fhead th:nth-child(8), .w8 .fbody td:nth-child(8) { width: 8%; }
  .w4 .fhead th:nth-child(1), .w4 .fbody td:nth-child(1) { width: 7%; }
  .w4 .fhead th:nth-child(2), .w4 .fbody td:nth-child(2) { width: 41%; }
  .w4 .fhead th:nth-child(3), .w4 .fbody td:nth-child(3) { width: 41%; }
  .w4 .fhead th:nth-child(4), .w4 .fbody td:nth-child(4) { width: 11%; }
  .empty { color: #94a3b8; font-size: 13px; padding: 20px 0; text-align: center; }
  .upd { color: #94a3b8; font-size: 12px; margin: 10px 0; }
  .state { display: none; }
  .state.on { display: block; }
</style>
</head>
<body>
<div id="app">
  <h1 class="top">🛒 电商工作台 <span class="sub">Shopee / TikTok 印尼 · MULMUL</span></h1>
  <div class="tabs">
    <button class="tab on" data-plat="shopee" onclick="switchTab('shopee')">Shopee · MULMUL</button>
    <button class="tab" data-plat="tk" onclick="switchTab('tk')">TikTok Shop · MULMUL</button>
  </div>

  <div id="state-shopee" class="state on">
    <div class="upd" id="upd-shopee"></div>
    <div class="cards" id="cards-shopee"></div>
    <div class="panel"><h2>🕐 最近订单 <span class="tag">待发货/取消标红</span></h2><div id="recentOrders-shopee"></div></div>
    <div class="panel"><h2>🚚 未发货订单（全店待发货） <span class="tag">发货后自动移除</span></h2><div id="toshipOrders-shopee"></div></div>
  </div>

  <div id="state-tk" class="state">
    <div class="upd" id="upd-tk"></div>
    <div class="cards" id="cards-tk"></div>
    <div class="panel"><h2>🕐 最近订单 <span class="tag">待发货/取消标红</span></h2><div id="recentOrders-tk"></div></div>
    <div class="panel"><h2>🚚 未发货订单（全店待发货） <span class="tag">发货后自动移除</span></h2><div id="toshipOrders-tk"></div></div>
  </div>
</div>

<script>
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fixedTable(cols, rowsHtml, cls) {
  if (!rowsHtml) return '<div class="empty">暂无数据</div>';
  return '<div class="' + cls + '"><div class="fhead"><table><thead><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead></table></div>' +
    '<div class="fbody"><table><tbody>' + rowsHtml + '</tbody></table></div></div>';
}
// 状态中文/红色判定：TK 状态名（Awaiting shipment…）与 Shopee（To Ship…）统一
var BAD = ['To Ship', 'To ship', 'Awaiting shipment', 'Unpaid', 'Cancelled', 'Canceled', 'Return/refund', 'Return / refund', 'Failed delivery', 'Pending'];
function stName(s) {
  s = String(s || '');
  var m = { 'Awaiting shipment': '待发货', 'To Ship': '待发货', 'To ship': '待发货', 'Shipped': '已发货', 'Completed': '已完成', 'Cancelled': '已取消', 'Canceled': '已取消', 'Unpaid': '未付款', 'Return/refund': '退货/退款', 'Return / refund': '退货/退款', 'Failed delivery': '配送失败', 'Pending': '处理中' };
  return m[s] || s;
}
function isBad(s) { return BAD.indexOf(String(s)) >= 0; }
function render(plat, d) {
  document.getElementById('upd-' + plat).textContent = '更新于 ' + (d.generatedAt || '') + ' · 数据每 15 分钟自动更新';
  var c = d.orders || {};
  var st = d.statusAgg || {};
  var cancelled = (st.Cancelled || 0) + (st.Canceled || 0);
  var toShip = d.toshipCount || 0;
  document.getElementById('cards-' + plat).innerHTML = [
    ['订单总数', c.count + ' 单', ''],
    ['取消订单', cancelled + ' 单', cancelled ? 'red' : ''],
    ['总销售额', (c.amountLocal ? 'Rp ' + Math.round(c.amountLocal).toLocaleString('en-US') : '—'), 'green'],
    ['已售件数', c.totalQty + ' 件', ''],
    ['待发货', toShip + ' 单', toShip ? 'red' : '']
  ].map(function (x) { return '<div class="card"><div class="k">' + x[0] + '</div><div class="v ' + x[2] + '">' + x[1] + '</div></div>'; }).join('');
  document.getElementById('recentOrders-' + plat).innerHTML = fixedTable(['#', '下单时间', '订单号', 'SKU', '件数', '销售金额', '应到账', '状态'],
    (d.recent || []).map(function (o, i) {
      var incCell = o.inc != null && o.inc !== '' ? 'Rp ' + Number(o.inc).toLocaleString('en-US') : (plat === 'tk' ? '—' : '—');
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(o.d) + '</td><td>' + esc(o.id) + '</td><td>' + esc(o.sku) + '</td><td>' + (o.qty || '') + '</td><td>' + (o.amt != null ? 'Rp ' + Number(o.amt).toLocaleString('en-US') : '—') + '</td><td>' + incCell + '</td><td' + (isBad(o.st) ? ' class="st-red"' : '') + '>' + esc(stName(o.st)) + '</td></tr>';
    }).join(''), 'w8');
  document.getElementById('toshipOrders-' + plat).innerHTML = (d.toship && d.toship.length) ? fixedTable(['#', '下单时间', '订单号', '状态'],
    d.toship.map(function (o, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(o.d) + '</td><td>' + esc(o.id) + '</td><td class="st-red">' + esc(stName(o.st || '待发货')) + '</td></tr>'; }).join(''), 'w4')
    : '<div class="empty">🎉 全部已发货</div>';
}
function load(plat) {
  fetch((plat === 'tk' ? 'tk.json' : 'data.json') + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    render(plat, d);
  }).catch(function () { document.getElementById('upd-' + plat).textContent = '数据加载失败'; });
}
function switchTab(plat) {
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.plat === plat); });
  document.querySelectorAll('.state').forEach(function (s) { s.classList.toggle('on', s.id === 'state-' + plat); });
  load(plat);
}
load('shopee');
</script>
</body>
</html>
