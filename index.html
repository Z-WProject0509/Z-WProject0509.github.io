<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f4f8; color: #1f2d3d; padding: 20px; }
  .gate { position: fixed; inset: 0; background: #f0f4f8; display: flex; align-items: center; justify-content: center; z-index: 99; }
  .gate-box { background: #fff; padding: 34px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; width: 320px; }
  .gate-box h1 { font-size: 20px; margin-bottom: 6px; }
  .gate-box .sub { color: #7a8ba3; font-size: 13px; margin-bottom: 16px; }
  .gate-box input { width: 100%; padding: 10px 12px; border: 1px solid #d5dee8; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  .gate-box button { width: 100%; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px; font-size: 15px; cursor: pointer; }
  .err { color: #dc2626; font-size: 13px; margin-top: 8px; min-height: 18px; }
  h1.top { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #7a8ba3; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .k { font-size: 13px; color: #7a8ba3; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; color: #0e2a47; }
  .card .v.red { color: #dc2626; }
  .card .v.green { color: #16a34a; }
  .panel { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .panel h2 { font-size: 16px; margin-bottom: 10px; color: #0e2a47; }
  .panel h2 .tag { font-size: 12px; color: #7a8ba3; font-weight: 400; }
  .fhead { overflow: hidden; background: #fafbfd; border-bottom: 2px solid #e2e8f0; }
  .fbody { max-height: min(58vh, 560px); overflow: auto; }
  .fhead table, .fbody table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  .fhead th, .fbody td { padding: 7px 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .fbody td { border-bottom: 1px solid #eef2f7; }
  .st-red { color: #dc2626; font-weight: 700; }
  .w8 .fhead th:nth-child(1), .w8 .fbody td:nth-child(1) { width: 5%; }
  .w8 .fhead th:nth-child(2), .w8 .fbody td:nth-child(2) { width: 15%; }
  .w8 .fhead th:nth-child(3), .w8 .fbody td:nth-child(3) { width: 15%; }
  .w8 .fhead th:nth-child(4), .w8 .fbody td:nth-child(4) { width: 17%; }
  .w8 .fhead th:nth-child(5), .w8 .fbody td:nth-child(5) { width: 6%; }
  .w8 .fhead th:nth-child(6), .w8 .fbody td:nth-child(6) { width: 13%; }
  .w8 .fhead th:nth-child(7), .w8 .fbody td:nth-child(7) { width: 13%; }
  .w8 .fhead th:nth-child(8), .w8 .fbody td:nth-child(8) { width: 8%; }
  .w4 .fhead th:nth-child(1), .w4 .fbody td:nth-child(1) { width: 7%; }
  .w4 .fhead th:nth-child(2), .w4 .fbody td:nth-child(2) { width: 41%; }
  .w4 .fhead th:nth-child(3), .w4 .fbody td:nth-child(3) { width: 41%; }
  .w4 .fhead th:nth-child(4), .w4 .fbody td:nth-child(4) { width: 11%; }
  .empty { color: #94a3b8; font-size: 13px; padding: 20px 0; text-align: center; }
  .upd { color: #94a3b8; font-size: 12px; margin: 10px 0; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-box">
    <h1>🛒 电商工作台</h1>
    <div class="sub">请输入访问密码</div>
    <input type="password" id="pw" placeholder="密码" autocomplete="off">
    <button onclick="checkPw()">进入</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app" style="display:none">
  <h1 class="top">🛒 电商工作台 <span class="sub">Shopee 印尼 · MULMUL</span></h1>
  <div class="upd" id="upd"></div>
  <div class="cards" id="cards"></div>
  <div class="panel"><h2>🕐 最近订单 <span class="tag">待发货/取消标红</span></h2><div id="recentOrders"></div></div>
  <div class="panel"><h2>🚚 未发货订单（全店待发货） <span class="tag">发货后自动移除</span></h2><div id="toshipOrders"></div></div>
</div>

<script>
var HASH = '87d820bbf89694dea253134841e8b656ae446ab92ea5d0f68d9f17cbba8b86dd';

// 标准 SHA-256（轻量实现，仅用于口令校验）
function sha256hex(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), result = '';
  var words = [], asciiBitLength = ascii.length * 8, hash = [], k = [], primeCounter = 0, isComposite = {};
  var candidate, next, block, i, j;
  for (candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return;
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (j = 0; j < words.length;) {
    block = words.slice(j, j += 16);
    var oldHash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w = block[i - 15], a = block[i + 1], b = block[i + 2], c = block[i + 3], e = block[i + 4];
      if (i < 16) w = block[i];
      else {
        var s0 = rightRotate(w, 7) ^ rightRotate(w, 18) ^ (w >>> 3);
        var s1 = rightRotate(a, 17) ^ rightRotate(a, 19) ^ (a >>> 10);
        block[i] = (s0 + block[i - 7] + s1 + block[i - 16]) | 0;
      }
      var s2 = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
      var t2 = (s2 + hash[7] + k[i] + (i < 16 ? w : block[i])) | 0;
      hash[7] = hash[6]; hash[6] = hash[5]; hash[5] = hash[4];
      hash[4] = (hash[3] + t2) | 0;
      var s3 = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
      hash[3] = hash[2]; hash[2] = hash[1]; hash[1] = hash[0];
      hash[0] = (s3 + ((hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2])) + t2) | 0;
    }
    for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}
function checkPw() {
  var v = document.getElementById('pw').value;
  if (sha256hex(v) === HASH) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = '';
    load();
  } else {
    document.getElementById('pwErr').textContent = '密码错误';
  }
}
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fixedTable(cols, rowsHtml, cls) {
  if (!rowsHtml) return '<div class="empty">暂无数据</div>';
  return '<div class="' + cls + '"><div class="fhead"><table><thead><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead></table></div>' +
    '<div class="fbody"><table><tbody>' + rowsHtml + '</tbody></table></div></div>';
}
function load() {
  fetch('data.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('upd').textContent = '更新于 ' + (d.generatedAt || '') + ' · 数据每 15 分钟自动更新';
    var c = d.orders || {};
    var st = d.statusAgg || {};
    var cancelled = st.Cancelled || 0;
    var toShip = d.toshipCount || 0;
    document.getElementById('cards').innerHTML = [
      ['订单总数', c.count + ' 单', ''],
      ['取消订单', cancelled + ' 单', cancelled ? 'red' : ''],
      ['总销售额', (c.amountLocal ? 'Rp ' + Math.round(c.amountLocal).toLocaleString('en-US') : '—'), 'green'],
      ['已售件数', c.totalQty + ' 件', ''],
      ['待发货', toShip + ' 单', toShip ? 'red' : '']
    ].map(function (x) { return '<div class="card"><div class="k">' + x[0] + '</div><div class="v ' + x[2] + '">' + x[1] + '</div></div>'; }).join('');
    var bad = function (s) { return ['To Ship', 'Unpaid', 'Cancelled', 'Return/Refund'].indexOf(s) >= 0; };
    document.getElementById('recentOrders').innerHTML = fixedTable(['#', '下单时间', '订单号', 'SKU', '件数', '销售金额', '应到账', '状态'],
      (d.recent || []).map(function (o, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(o.d) + '</td><td>' + esc(o.id) + '</td><td>' + esc(o.sku) + '</td><td>' + (o.qty || '') + '</td><td>' + (o.amt != null ? 'Rp ' + Number(o.amt).toLocaleString('en-US') : '—') + '</td><td>' + (o.inc != null ? 'Rp ' + Number(o.inc).toLocaleString('en-US') : '—') + '</td><td' + (bad(o.st) ? ' class="st-red"' : '') + '>' + esc(o.st) + '</td></tr>';
      }).join(''), 'w8');
    document.getElementById('toshipOrders').innerHTML = (d.toship && d.toship.length) ? fixedTable(['#', '下单时间', '订单号', '状态'],
      d.toship.map(function (o, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(o.d) + '</td><td>' + esc(o.id) + '</td><td class="st-red">' + esc(o.st || 'To Ship') + '</td></tr>'; }).join(''), 'w4')
      : '<div class="empty">🎉 全部已发货</div>';
  }).catch(function () { document.getElementById('upd').textContent = '数据加载失败'; });
}
document.getElementById('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') checkPw(); });
</script>
</body>
</html>
