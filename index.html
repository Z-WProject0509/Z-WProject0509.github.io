<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电商工作台 · 双平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f4f8; color: #1f2d3d; padding: 20px; }
  h1.top { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #7a8ba3; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0 12px; }
  .tab { padding: 8px 18px; border-radius: 8px; background: #dde5ee; color: #4b5d71; font-size: 14px; font-weight: 600; cursor: pointer; border: none; user-select: none; }
  .tab.on { background: #0e2a47; color: #fff; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card .k { font-size: 13px; color: #7a8ba3; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; color: #0e2a47; word-break: break-all; }
  .card .v.red { color: #dc2626; }
  .card .v.green { color: #16a34a; }
  .card .m { font-size: 11px; color: #94a3b8; margin-top: 4px; line-height: 1.6; }
  .panel { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .panel h2 { font-size: 16px; margin-bottom: 10px; color: #0e2a47; }
  .panel h2 .tag { font-size: 12px; color: #7a8ba3; font-weight: 400; }
  .fhead { overflow: hidden; background: #fafbfd; border-bottom: 2px solid #e2e8f0; }
  .fbody { max-height: min(58vh, 560px); overflow: auto; }
  .fhead table, .fbody table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  .fhead th, .fbody td { padding: 7px 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .fbody td { border-bottom: 1px solid #eef2f7; }
  .st-red { color: #dc2626; font-weight: 700; }
  .w8 .fhead th:nth-child(1), .w8 .fbody td:nth-child(1) { width: 5%; }
  .w8 .fhead th:nth-child(2), .w8 .fbody td:nth-child(2) { width: 15%; }
  .w8 .fhead th:nth-child(3), .w8 .fbody td:nth-child(3) { width: 15%; }
  .w8 .fhead th:nth-child(4), .w8 .fbody td:nth-child(4) { width: 17%; }
  .w8 .fhead th:nth-child(5), .w8 .fbody td:nth-child(5) { width: 6%; }
  .w8 .fhead th:nth-child(6), .w8 .fbody td:nth-child(6) { width: 13%; }
  .w8 .fhead th:nth-child(7), .w8 .fbody td:nth-child(7) { width: 13%; }
  .w8 .fhead th:nth-child(8), .w8 .fbody td:nth-child(8) { width: 8%; }
  .w4 .fhead th:nth-child(1), .w4 .fbody td:nth-child(1) { width: 7%; }
  .w4 .fhead th:nth-child(2), .w4 .fbody td:nth-child(2) { width: 41%; }
  .w4 .fhead th:nth-child(3), .w4 .fbody td:nth-child(3) { width: 41%; }
  .w4 .fhead th:nth-child(4), .w4 .fbody td:nth-child(4) { width: 11%; }
  .empty { color: #94a3b8; font-size: 13px; padding: 20px 0; text-align: center; }
  .upd { color: #94a3b8; font-size: 12px; margin: 0 0 10px; }
  .state { display: none; }
  .state.on { display: block; }
  .layout { display: flex; gap: 18px; align-items: flex-start; }
  .main { flex: 1; min-width: 0; }
  .side { width: 300px; flex-shrink: 0; position: sticky; top: 16px; }
  .side .panel { margin-bottom: 14px; }
  .side .panel h2 { font-size: 14px; }
  .snap-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #eef2f7; }
  .snap-row:last-child { border-bottom: 0; }
  .snap-row .k { color: #7a8ba3; }
  .snap-row .v { font-weight: 700; color: #0e2a47; }
  .snap-row .v.red { color: #dc2626; }
  .snap-row .v.green { color: #16a34a; }
  .fx-row { display: flex; align-items: baseline; gap: 6px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #eef2f7; }
  .fx-row .k2 { color: #7a8ba3; font-size: 12px; width: 88px; flex-shrink: 0; }
  .fx-row .big { font-size: 16px; font-weight: 700; color: #0e2a47; }
  .fx-row .lbl { color: #94a3b8; font-size: 11px; margin-left: auto; }
  .fx-note { color: #94a3b8; font-size: 11px; margin-top: 6px; line-height: 1.7; }
  .fx-calc { margin-top: 10px; border-top: 1px solid #e2e8f0; padding-top: 8px; }
  .fx-calc .fxc-title { font-size: 12px; color: #0e2a47; font-weight: 700; margin-bottom: 6px; }
  .fx-calc .fxc-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 6px 0; }
  .fx-calc select, .fx-calc input { padding: 6px 8px; border: 1px solid #d7dee8; border-radius: 6px; font-size: 14px; flex: 1; min-width: 0; }
  .fx-calc .fxr { color: #16a34a; font-size: 18px; }
  @media (max-width: 1100px) { .layout { flex-direction: column; } .side { width: 100%; position: static; } }
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <h1 class="top">🛒 电商工作台 <span class="sub">站斧多店铺 · 并行同步 · 各自计时</span></h1>
    <div class="tabs">
      <button class="tab on" data-plat="shopee" onclick="switchTab('shopee')">Shopee—MULMUL</button>
      <button class="tab" data-plat="tk" onclick="switchTab('tk')">TikTok—MULMUL</button>
    </div>
    <div class="upd" id="upd"></div>
    <div id="state-shopee" class="state on">
      <div class="cards" id="cards-shopee"></div>
      <div class="panel"><h2>🕐 最近订单 <span class="tag">待发货/取消标红</span></h2><div id="recentOrders-shopee"></div></div>
      <div class="panel"><h2>🚚 未发货订单（全店待发货） <span class="tag">发货后自动移除</span></h2><div id="toshipOrders-shopee"></div></div>
    </div>
    <div id="state-tk" class="state">
      <div class="cards" id="cards-tk"></div>
      <div class="panel"><h2>🕐 最近订单 <span class="tag">待发货/取消标红</span></h2><div id="recentOrders-tk"></div></div>
      <div class="panel"><h2>🚚 未发货订单（全店待发货） <span class="tag">发货后自动移除</span></h2><div id="toshipOrders-tk"></div></div>
    </div>
  </div>

  <!-- ===== 右侧栏 ===== -->
  <aside class="side">
    <div class="panel"><h2>📌 今日快照</h2><div id="sideSnapshot"><div class="empty">加载中…</div></div></div>
    <div class="panel"><h2>💱 实时汇率</h2><div id="rateBox" class="sub"></div></div>
    <div class="panel"><h2>ℹ️ 数据说明</h2>
      <div class="sub" style="line-height:1.8">
        数据来源：站斧店铺环境自动同步（只读）<br>
        · 当日实时：最新同步结果<br>
        · 数据每 15 分钟自动更新<br>
        · 待发货/取消标红<br>
        · 汇率折算仅供参考
      </div>
    </div>
  </aside>
</div>

<script>
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fixedTable(cols, rowsHtml, cls) {
  if (!rowsHtml) return '<div class="empty">暂无数据</div>';
  return '<div class="' + cls + '"><div class="fhead"><table><thead><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead></table></div>' +
    '<div class="fbody"><table><tbody>' + rowsHtml + '</tbody></table></div></div>';
}
var BAD = ['To Ship', 'To ship', 'Awaiting shipment', 'Unpaid', 'Cancelled', 'Canceled', 'Return/refund', 'Return / refund', 'Failed delivery', 'Pending'];
function stName(s) {
  s = String(s || '');
  var m = { 'Awaiting shipment': '待发货', 'To Ship': '待发货', 'To ship': '待发货', 'Shipped': '已发货', 'Completed': '已完成', 'Cancelled': '已取消', 'Canceled': '已取消', 'Unpaid': '未付款', 'Return/refund': '退货/退款', 'Return / refund': '退货/退款', 'Failed delivery': '配送失败', 'Pending': '处理中' };
  return m[s] || s;
}
function isBad(s) { return BAD.indexOf(String(s)) >= 0; }
var PLAT_NAME = { shopee: 'Shopee—MULMUL', tk: 'TikTok—MULMUL' };
var cache = {};
function fmtRp(n) { return n == null ? '—' : 'Rp ' + Math.round(n).toLocaleString('en-US'); }
function fmtCny(n) { return n == null ? '—' : '≈ ¥' + Math.round(n).toLocaleString('en-US'); }
function storeNameOf(plat, d) { return (d && d.storeName) ? d.storeName : PLAT_NAME[plat]; }

// 从 fx.list 取某币种条目（新结构）
function fxItem(fx, code) {
  if (fx && fx.list) { for (var i = 0; i < fx.list.length; i++) { if (fx.list[i].code === code) return fx.list[i]; } }
  return null;
}
function calcFx() {
  try {
    var list = window.__fxList || [];
    var from = document.getElementById('fxFrom');
    var amtEl = document.getElementById('fxAmount');
    if (!from || !amtEl) return;
    var code = from.value;
    var amt = parseFloat(amtEl.value);
    if (isNaN(amt)) { document.getElementById('fxResult').textContent = '—'; return; }
    var item = null;
    for (var i = 0; i < list.length; i++) { if (list[i].code === code) { item = list[i]; break; } }
    if (!item) return;
    var out;
    if (code === 'CNY') {
      // 输入人民币 → 显示折算成其他币不直观，直接显示人民币
      out = '¥ ' + amt.toLocaleString('en-US', { maximumFractionDigits: 2 });
    } else {
      out = '¥ ' + (amt * item.cnyPer).toLocaleString('en-US', { maximumFractionDigits: 2 });
    }
    document.getElementById('fxResult').textContent = out;
  } catch (e) {}
}

function renderSide(plat, d) {
  var c = d.orders || {};
  var st = d.statusAgg || {};
  var cancelled = (st.Cancelled || 0) + (st.Canceled || 0);
  var fx = d.fx || null;
  var idrFx = fxItem(fx, 'IDR');
  var cny = fx && c.amountLocal != null && idrFx ? c.amountLocal * idrFx.cnyPer : null;
  var sName = storeNameOf(plat, d);
  var syncTxt = d.syncMinutes != null ? ' · ⏱ 本次更新用时 ' + d.syncMinutes + ' 分钟' : '';
  var tabEl = document.querySelector('.tab[data-plat="' + plat + '"]');
  if (tabEl) tabEl.textContent = sName;
  document.getElementById('upd').textContent = sName + ' — 更新于 ' + (d.generatedAt || '') + ' · 数据每 15 分钟自动更新' + syncTxt;
  document.getElementById('sideSnapshot').innerHTML =
    '<div class="snap-row"><span class="k">店铺</span><span class="v">' + esc(sName) + '</span></div>' +
    '<div class="snap-row"><span class="k">订单总数</span><span class="v">' + (c.count || 0) + ' 单</span></div>' +
    '<div class="snap-row"><span class="k">取消订单</span><span class="v' + (cancelled ? ' red' : '') + '">' + cancelled + ' 单</span></div>' +
    '<div class="snap-row"><span class="k">总销售额</span><span class="v">' + fmtRp(c.amountLocal) + '</span></div>' +
    '<div class="snap-row"><span class="k">折合人民币</span><span class="v green">' + fmtCny(cny) + '</span></div>' +
    '<div class="snap-row"><span class="k">已售件数</span><span class="v">' + (c.totalQty || 0) + ' 件</span></div>' +
    '<div class="snap-row"><span class="k">待发货</span><span class="v' + ((d.toshipCount || 0) ? ' red' : '') + '">' + (d.toshipCount || 0) + ' 单</span></div>';
  if (fx && fx.list && fx.list.length) {
    var chips = fx.list.filter(function (x) { return x.code !== 'CNY'; }).map(function (x) {
      return '<div class="fx-row"><span class="k2">¥1 ≈ ' + esc(x.symbol) + '</span><span class="big">' + x.perCny.toLocaleString('en-US') + '</span><span class="lbl">' + esc(x.label) + '</span></div>';
    }).join('');
    document.getElementById('rateBox').innerHTML =
      chips +
      '<div class="fx-note">汇率实时（每 15 分钟随数据更新）· 更新于 ' + esc(fx.updatedAt.replace('T', ' ').slice(0, 16)) + '</div>' +
      '<div class="fx-calc"><div class="fxc-title">💱 换算（币种可选 · 汇率实时）</div>' +
      '<div class="fxc-row"><select id="fxFrom"></select><input id="fxAmount" type="number" placeholder="金额" value="100"></div>' +
      '<div class="fxc-row">≈ <b id="fxResult" class="fxr">—</b></div></div>';
    var sel = document.getElementById('fxFrom');
    sel.innerHTML = fx.list.map(function (x) { return '<option value="' + x.code + '">' + esc(x.label) + ' (' + esc(x.symbol) + ')</option>'; }).join('');
    window.__fxList = fx.list;
    sel.onchange = calcFx; document.getElementById('fxAmount').oninput = calcFx;
    calcFx();
  } else {
    document.getElementById('rateBox').innerHTML = '<div class="sub">汇率暂不可用</div>';
  }
}

function render(plat, d) {
  renderSide(plat, d);
  var c = d.orders || {};
  var st = d.statusAgg || {};
  var cancelled = (st.Cancelled || 0) + (st.Canceled || 0);
  var toShip = d.toshipCount || 0;
  var fx = d.fx || null;
  var idrFx = fxItem(fx, 'IDR');
  var cny = fx && c.amountLocal != null && idrFx ? c.amountLocal * idrFx.cnyPer : null;
  var fxNote = fx && fx.updatedAt ? '汇率更新于 ' + fx.updatedAt.slice(0, 10) : '';
  document.getElementById('cards-' + plat).innerHTML = [
    ['订单总数', (c.count || 0) + ' 单', ''],
    ['取消订单', cancelled + ' 单', cancelled ? 'red' : ''],
    ['总销售额', fmtRp(c.amountLocal), 'green'],
    ['折合人民币', fmtCny(cny), cny ? 'green' : ''],
    ['已售件数', (c.totalQty || 0) + ' 件', ''],
    ['待发货', toShip + ' 单', toShip ? 'red' : '']
  ].map(function (x) {
    var extra = x[0] === '折合人民币' && fx && idrFx ? '<div class="m">¥1 ≈ Rp ' + idrFx.perCny.toLocaleString('en-US') + '<br>' + esc(fxNote) + '</div>' : '';
    return '<div class="card"><div class="k">' + x[0] + '</div><div class="v ' + x[2] + '">' + x[1] + '</div>' + extra + '</div>';
  }).join('');
  document.getElementById('recentOrders-' + plat).innerHTML = fixedTable(['#', '下单时间', '订单号', 'SKU', '件数', '销售金额', '应到账', '状态'],
    (d.recent || []).map(function (o, i) {
      var incCell = o.inc != null && o.inc !== '' ? fmtRp(o.inc) : '—';
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(o.d) + '</td><td>' + esc(o.id) + '</td><td>' + esc(o.sku) + '</td><td>' + (o.qty || '') + '</td><td>' + fmtRp(o.amt) + '</td><td>' + incCell + '</td><td' + (isBad(o.st) ? ' class="st-red"' : '') + '>' + esc(stName(o.st)) + '</td></tr>';
    }).join(''), 'w8');
  document.getElementById('toshipOrders-' + plat).innerHTML = (d.toship && d.toship.length) ? fixedTable(['#', '下单时间', '订单号', '状态'],
    d.toship.map(function (o, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(o.d) + '</td><td>' + esc(o.id) + '</td><td class="st-red">' + esc(stName(o.st || '待发货')) + '</td></tr>'; }).join(''), 'w4')
    : '<div class="empty">🎉 全部已发货</div>';
}
function load(plat) {
  var url = plat === 'tk' ? 'tk.json' : 'data.json';
  if (cache[plat]) { render(plat, cache[plat]); return; }
  fetch(url + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    cache[plat] = d; render(plat, d);
  }).catch(function () { document.getElementById('upd').textContent = '数据加载失败'; });
}
function switchTab(plat) {
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.plat === plat); });
  document.querySelectorAll('.state').forEach(function (s) { s.classList.toggle('on', s.id === 'state-' + plat); });
  load(plat);
}
load('shopee');
// 每 5 分钟自动刷新当前平台
setInterval(function () {
  var cur = document.querySelector('.tab.on');
  if (cur) { cache[cur.dataset.plat] = null; load(cur.dataset.plat); }
}, 5 * 60 * 1000);
</script>
</body>
</html>
